name: Deploy to GitHub Pages

on:
  push:
    branches: [bulls-and-cows]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новый пуш отменяет незаконченный деплой предыдущего
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # На сайт попадают только файлы, которые нужны браузеру
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -r dist _site/dist

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
